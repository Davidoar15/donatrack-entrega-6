# ---------------------------------------------------------------- Base de datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# ---------------------------------------------------------------- Actuator
# Solo lo necesario. Con include=* quedaban publicos /actuator/env (que filtra el connection
# string y la API key de Datadog) y /actuator/heapdump, sin autenticacion.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=donaciones
management.metrics.tags.service=donaciones
management.metrics.tags.env=${DD_ENV:prod}

# Datadog: apagado por defecto para no loguear errores cada 30s cuando no hay API key.
management.datadog.metrics.export.enabled=${DATADOG_ENABLED:false}
management.datadog.metrics.export.api-key=${DATADOG_API_KEY:}
management.datadog.metrics.export.uri=${DATADOG_URI:https://api.datadoghq.com}
management.datadog.metrics.export.step=${DATADOG_STEP:30s}

# ---------------------------------------------------------------- OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Los requests propios no aceptan campos desconocidos (por ejemplo, IDs definidos por clientes).
spring.jackson.deserialization.fail-on-unknown-properties=true

# ---------------------------------------------------------------- Integraciones
# Obligatorias fuera de los perfiles dev/test: sin ellas el modulo arrancaria con fachadas de
# prueba que aceptan cualquier donador. Ver FachadasExternasConfig.
donatrack.donadores-y-entidades.url=${DONADORES_Y_ENTIDADES_URL:}
donatrack.logistica.url=${LOGISTICA_URL:}

# ---------------------------------------------------------------- Servidor
server.port=${PORT:8080}

spring.application.name=donaciones

# Histograms permit p95/p99 queries instead of relying only on averages.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Entrega 6 - publicación de eventos para el modelo de lectura CQRS
spring.rabbitmq.addresses=${RABBITMQ_URL:}
donatrack.read-model.publisher.enabled=${READ_MODEL_PUBLISHER_ENABLED:false}
donatrack.read-model.exchange=${READ_MODEL_EXCHANGE:donatrack.readmodel.exchange}
donatrack.read-model.routing-key=${READ_MODEL_ROUTING_KEY:readmodel.changed}
