# JPA/Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# DevTools Configuration
spring.devtools.restart.enabled=true

# Server Configuration for Dockerfile
server.port=${PORT:8080}

# SWAGGER
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# POSTGRES
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# INTEGRACIONES
integrations.donadores-url=${DONADORES_URL}
integrations.donaciones-url=${DONACIONES_URL}

# Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ACTUATOR
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# GRAFANA CLOUD - OTLP
management.otlp.metrics.export.enabled=${GRAFANA_OTLP_METRICS_ENABLED:false}
management.otlp.metrics.export.url=${GRAFANA_OTLP_METRICS_URL:}
management.otlp.metrics.export.headers.Authorization=${GRAFANA_OTLP_HEADERS:}
management.otlp.metrics.export.step=30s
management.otlp.metrics.export.aggregation-temporality=cumulative

# Identificación
management.metrics.tags.service=donatrack-logistica
management.metrics.tags.environment=production
management.metrics.tags.component=api

app.component=api
app.instance-id=${RENDER_INSTANCE_ID:${INSTANCE_NAME:logistica-api}}

# LOGGING CENTRALIZADO
# BETTERSTACK_SOURCE_TOKEN=<source-token>
# BETTERSTACK_INGEST_URL=https://<ingesting-host>
# APP_NAME=donatrack-logistica

# Desactivar otros exporters
management.prometheus.metrics.export.enabled=${PROMETHEUS_ENABLED:true}
management.datadog.metrics.export.enabled=false

# RabbitMQ
# URL provista por CloudAMQP
spring.rabbitmq.addresses=${RABBITMQ_URL}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Histograms permit p95/p99 queries instead of relying only on averages.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Entrega 6 - publicación de eventos para el modelo de lectura CQRS
donatrack.read-model.publisher.enabled=${READ_MODEL_PUBLISHER_ENABLED:false}
donatrack.read-model.exchange=${READ_MODEL_EXCHANGE:donatrack.readmodel.exchange}
donatrack.read-model.routing-key=${READ_MODEL_ROUTING_KEY:readmodel.changed}

spring.application.name=logistica
